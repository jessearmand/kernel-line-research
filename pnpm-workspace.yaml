# Keep the global 7-day minimumReleaseAge. Exempt only the wrangler 4.129.0
# stack and the two transitive versions that failed lockfile verification.
minimumReleaseAgeExclude:
  - wrangler@4.129.0
  - "@cloudflare/vite-plugin@1.54.4"
  - miniflare@5.20260903.0-alpha
  - workerd@1.20260903.1
  - "@cloudflare/workerd-darwin-64@1.20260903.1"
  - "@cloudflare/workerd-darwin-arm64@1.20260903.1"
  - "@cloudflare/workerd-linux-64@1.20260903.1"
  - "@cloudflare/workerd-linux-arm64@1.20260903.1"
  - "@cloudflare/workerd-windows-64@1.20260903.1"
  - electron-to-chromium@1.5.417
  - ignore@7.0.8

# wrangler postinstall needs the workerd binary and esbuild.
allowBuilds:
  esbuild: true
  workerd: true
